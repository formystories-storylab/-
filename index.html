<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>녹음 전 음량 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow centered column for a 1/3 Split View pane — title, live meter, 10s graph, centered button, result */
:root {
  --bg: #eef1f3;
  --panel: #ffffff;
  --ink: #15191d;
  --muted: #5d6a74;
  --line: #d3dade;
  --accent: #0b6e8a;
  --ok: #1f8a4c;
  --warn: #b86b00;
  --bad: #c2362b;
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --panel: #182026; --ink: #e7ecef; --muted: #8d9aa3;
    --line: #2a353d; --accent: #4fb6d3; --ok: #46c27a; --warn: #e5a03a; --bad: #ef6b5f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--font-body);
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }

h1 {
  margin: 8px 0 0; text-align: center; text-wrap: balance;
  font-size: clamp(22px, 6.5vw, 30px); line-height: 1.3; font-weight: 700; letter-spacing: -.01em;
}
.lead { margin: -8px 0 0; text-align: center; color: var(--muted); font-size: 14px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; display: grid; gap: 12px; }
.label { font-size: 12px; letter-spacing: .06em; color: var(--muted); }

.big { display: flex; align-items: baseline; justify-content: center; gap: 6px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.big .value { font-size: clamp(56px, 17vw, 88px); font-weight: 600; line-height: 1; letter-spacing: -.03em; }
.big .unit { font-size: 18px; color: var(--muted); }

.scale { position: relative; height: 18px; border-radius: 4px; background: var(--line); overflow: hidden; }
.scale .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width .06s linear; }
.scale .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .55; }
.ticks { position: relative; height: 16px; font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); }

canvas { display: block; width: 100%; height: 110px; }

.actions { display: grid; justify-items: center; gap: 10px; }
#btn {
  font: 700 18px var(--font-body); border: 0; border-radius: 999px; cursor: pointer;
  padding: 16px 40px; min-width: 200px; background: var(--accent); color: var(--panel);
  position: relative; overflow: hidden;
}
#btn[disabled] { cursor: default; }
#btn .bar { position: absolute; inset: auto 0 0 0; height: 4px; background: var(--panel); opacity: .6; transform-origin: left; transform: scaleX(0); }
#btn:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.hint { font-size: 14px; color: var(--muted); text-align: center; margin: 0; min-height: 1.5em; }
.hint.error { color: var(--bad); font-weight: 600; }

.result { text-align: center; gap: 6px; }
.result .avg { font-family: var(--font-num); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.result .avg b { font-size: 28px; color: var(--ink); }
.result .msg { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.45; text-wrap: balance; color: var(--ink); }

details { font-size: 13px; color: var(--muted); }
summary { cursor: pointer; }
.cal { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.cal input { width: 70px; font: 15px var(--font-num); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .scale .fill { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>녹음하기 전,<br>음량을 테스트 해보세요!</h1>
  <p class="lead">버튼을 누르고 10초 동안 편하게 읽어보세요.</p>

  <section class="panel" aria-label="현재 음량">
    <div class="big"><span class="value" id="val">--</span><span class="unit">dB</span></div>
    <div>
      <div class="scale">
        <div class="fill" id="fill"></div>
        <div class="mark" id="m66"></div>
        <div class="mark" id="m70"></div>
      </div>
      <div class="ticks" id="ticks"></div>
    </div>
    <canvas id="hist" aria-label="10초 음량 그래프"></canvas>
  </section>

  <div class="actions">
    <button id="btn" type="button"><span id="btnText">측정 시작</span><span class="bar" id="bar"></span></button>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>

  <section class="panel result" id="result" hidden aria-live="polite">
    <div class="avg">10초 평균 <b id="avg">--</b> dB</div>
    <p class="msg" id="msg"></p>
  </section>

  <details>
    <summary>보정 설정</summary>
    <div class="cal">
      <label for="cal">마이크 원시값에</label>
      <input id="cal" type="number" inputmode="numeric" step="1" value="100">
      <span>dB를 더해 표시합니다.</span>
    </div>
  </details>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TEST_SEC = 10;
  const MIN_DB = 40, MAX_DB = 100;          // 막대·그래프 범위
  const QUIET_BELOW = 66, LOUD_FROM = 70;   // 판정 기준

  const MESSAGES = {
    quiet: '조금 더 크게 말하면 선명하게 녹음 돼요',
    ok: '이 정도 음량은 바깥에 들리지 않아서 괜찮아요',
    loud: '이정도 음량은 매니저 자리까지 들려요'
  };

  let stream = null, ctx = null, analyser = null, buf = null, rafId = 0;
  let running = false, startedAt = 0, shown = -160;
  let energySum = 0, frames = 0, history = [];

  // 보정값 (이 기기에만 저장)
  const calInput = $('cal');
  try { const v = localStorage.getItem('cal'); if (v !== null) calInput.value = v; } catch (e) {}
  calInput.addEventListener('change', () => { try { localStorage.setItem('cal', calInput.value); } catch (e) {} });
  const cal = () => Number(calInput.value) || 0;

  // 눈금과 기준선
  const pos = d => Math.max(0, Math.min(1, (d - MIN_DB) / (MAX_DB - MIN_DB)));
  for (let d = MIN_DB; d <= MAX_DB; d += 10) {
    const s = document.createElement('span');
    s.textContent = d;
    s.style.left = (pos(d) * 100) + '%';
    if (d === MIN_DB) s.style.transform = 'none';
    if (d === MAX_DB) s.style.transform = 'translateX(-100%)';
    $('ticks').appendChild(s);
  }
  $('m66').style.left = `calc(${pos(QUIET_BELOW) * 100}% - 1px)`;
  $('m70').style.left = `calc(${pos(LOUD_FROM) * 100}% - 1px)`;

  const hint = (t, err = false) => { $('hint').textContent = t; $('hint').className = 'hint' + (err ? ' error' : ''); };

  $('btn').onclick = () => { if (!running) start(); };

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      hint('이 주소에서는 마이크를 쓸 수 없어요. https 주소로 열어 주세요.', true); return;
    }
    setBtn(true, '준비 중…');
    $('result').hidden = true;
    hint('');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (e) {
      setBtn(false, '측정 시작');
      hint(e.name === 'NotAllowedError'
        ? '마이크 권한이 꺼져 있어요. 설정 > 앱 > Safari > 마이크에서 허용해 주세요.'
        : '마이크를 열 수 없어요. 음성 메모에서 녹음 중이라면 멈춘 뒤 다시 눌러 주세요.', true);
      return;
    }
    const track = stream.getAudioTracks()[0];
    track.onended = () => { if (running) abort('다른 앱이 마이크를 사용해서 테스트가 멈췄어요. 다시 눌러 주세요.'); };
    track.onmute = () => { if (running) abort('다른 앱이 마이크를 사용해서 테스트가 멈췄어요. 다시 눌러 주세요.'); };

    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    if (ctx.state !== 'running') { try { await ctx.resume(); } catch (e) {} }
    ctx.onstatechange = () => {
      if (running && ctx && ctx.state !== 'running') abort('테스트가 중간에 멈췄어요. 다시 눌러 주세요.');
    };

    running = true;
    energySum = 0; frames = 0; history = []; shown = -160;
    startedAt = performance.now();
    hint('편하게 읽어보세요.');
    rafId = requestAnimationFrame(loop);
  }

  function loop() {
    if (!running) return;
    rafId = requestAnimationFrame(loop);
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const db = (rms > 0 ? 20 * Math.log10(rms) : -160) + cal();

    shown = db > shown ? db : shown * 0.88 + db * 0.12;
    energySum += Math.pow(10, db / 10); frames++;

    const elapsed = (performance.now() - startedAt) / 1000;
    history.push({ t: elapsed, db: shown });

    $('val').textContent = shown > 0 ? shown.toFixed(0) : '--';
    $('fill').style.width = (pos(shown) * 100) + '%';
    const left = Math.max(0, Math.ceil(TEST_SEC - elapsed));
    $('btnText').textContent = `측정 중… ${left}초`;
    $('bar').style.transform = `scaleX(${Math.min(1, elapsed / TEST_SEC)})`;
    draw();

    if (elapsed >= TEST_SEC) finish();
  }

  function finish() {
    const avg = 10 * Math.log10(energySum / Math.max(1, frames));
    release();
    const kind = avg >= LOUD_FROM ? 'loud' : avg >= QUIET_BELOW ? 'ok' : 'quiet';
    $('avg').textContent = avg.toFixed(1);
    $('msg').textContent = MESSAGES[kind];
    $('result').className = 'panel result ' + kind;
    $('result').hidden = false;
    hint('마이크를 놓아 두었어요. 이제 음성 메모에서 녹음을 시작하세요.');
    setBtn(false, '다시 측정');
  }

  function abort(text) {
    release();
    hint(text, true);
    setBtn(false, '측정 시작');
  }

  // 테스트가 끝나면 마이크를 바로 놓아 줘서 음성 메모가 녹음할 수 있게 함
  function release() {
    running = false;
    cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(t => { t.onended = t.onmute = null; t.stop(); });
    if (ctx) { ctx.onstatechange = null; ctx.close().catch(() => {}); }
    stream = ctx = analyser = null;
    $('bar').style.transform = 'scaleX(0)';
  }

  function setBtn(disabled, text) {
    $('btn').disabled = disabled;
    $('btnText').textContent = text;
  }

  // 10초 그래프
  const cv = $('hist');
  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const css = getComputedStyle(document.documentElement);
    const v = n => css.getPropertyValue(n).trim();
    const padL = 22, padT = 6, padB = 16;
    const y = d => padT + (1 - pos(d)) * (h - padT - padB);
    const x = t => padL + (t / TEST_SEC) * (w - padL - 2);

    g.font = '10px ' + v('--font-num'); g.fillStyle = v('--muted'); g.strokeStyle = v('--line'); g.lineWidth = 1;
    [50, 66, 70, 90].forEach(d => {
      g.beginPath(); g.moveTo(padL, Math.round(y(d)) + .5); g.lineTo(w, Math.round(y(d)) + .5); g.stroke();
      g.fillText(d, 0, y(d) + 3);
    });
    g.textAlign = 'center';
    for (let s = 0; s <= TEST_SEC; s += 5) g.fillText(s + '초', Math.min(w - 12, Math.max(padL + 6, x(s))), h - 3);
    g.textAlign = 'left';

    g.strokeStyle = v('--accent'); g.lineWidth = 1.8; g.lineJoin = 'round';
    g.beginPath();
    let pen = false;
    history.forEach(p => {
      const py = y(p.db);
      pen ? g.lineTo(x(p.t), py) : g.moveTo(x(p.t), py);
      pen = true;
    });
    g.stroke();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) abort('화면을 벗어나서 테스트가 멈췄어요. 다시 눌러 주세요.');
  });
  window.addEventListener('resize', draw);

  if (!window.isSecureContext) hint('https 주소가 아니라 마이크가 막힐 수 있어요.', true);
  draw();
})();
</script>
</body>
</html>
